<head>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e0f2fe;--bg2:#fce7f3;--card:rgba(255,255,255,.7);--bd:rgba(255,255,255,.9);--tx:#1e1b4b;--sub:#6b7280;--ac1:#6366f1;--ac2:#ec4899;--sh:0 8px 24px rgba(99,102,241,.15)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f172a;--bg2:#2e1065;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#f8fafc;--sub:#a5b4fc;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg1:#0f172a;--bg2:#2e1065;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#f8fafc;--sub:#a5b4fc;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0}
html{height:100%}
body{min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.wrap{max-width:480px;margin:0 auto;text-align:center}
.av{width:104px;height:104px;margin:0 auto 16px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--ac1),var(--ac2));box-shadow:0 0 0 6px rgba(99,102,241,.12),var(--sh)}
.av div{width:100%;height:100%;border-radius:50%;background:var(--bg1);display:grid;place-items:center;font-size:40px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av{position:relative}
.vf{position:absolute;right:-2px;bottom:2px;width:30px;height:30px;filter:drop-shadow(0 2px 6px rgba(14,116,244,.45))}
h1{font-size:21px;font-weight:700;background:linear-gradient(90deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.s{margin-top:6px;font-size:14px;color:var(--sub)}
.list{margin-top:36px;display:grid;gap:14px}
a.l{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:18px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--sh);color:var(--tx);text-decoration:none;font-weight:600;font-size:15px;transition:transform .2s,box-shadow .2s}
a.l:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(236,72,153,.22)}
.ic{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff}
.ic svg{width:24px;height:24px;fill:currentColor}
.t{flex:1;text-align:center;padding-right:44px}
.z{background:linear-gradient(135deg,#1a8cff,#0068ff)}.zt{font-size:13px;font-weight:800;letter-spacing:-.3px;font-style:italic}.y{background:linear-gradient(135deg,#f43f5e,#dc2626)}.k{background:linear-gradient(135deg,#111827,#374151)}.d{background:linear-gradient(135deg,#818cf8,#4f46e5)}.g{background:linear-gradient(135deg,#f59e0b,#ec4899)}.f{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
#mb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--sh);font-size:21px;cursor:pointer;display:grid;place-items:center;color:var(--tx)}
#mb.on{background:linear-gradient(135deg,var(--ac1),var(--ac2));animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{box-shadow:0 0 0 10px rgba(236,72,153,.18)}}

.qr{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.qr[hidden]{display:none}
.qr-box{position:relative;width:100%;max-width:360px;max-height:100%;overflow:auto;text-align:center;padding:24px 20px 20px;border-radius:24px;background:var(--bg1);border:1px solid var(--bd);box-shadow:0 20px 50px rgba(0,0,0,.35);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.qr-box h3{font-size:18px;margin-bottom:14px;background:linear-gradient(90deg,var(--ac1),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.qr-box img{width:100%;max-width:280px;border-radius:16px;background:#fff;padding:10px;box-shadow:var(--sh)}
.qr-box p{margin-top:12px;font-size:14px;color:var(--sub)}
.qr-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border:0;border-radius:50%;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.qr-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.qr-tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 13px 'Be Vietnam Pro',sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
.qr-tabs button.act{background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;border-color:transparent}
.qr-link{display:inline-block;margin-top:14px;padding:10px 20px;border-radius:999px;background:linear-gradient(135deg,var(--ac1),var(--ac2));color:#fff;font-weight:600;font-size:14px;text-decoration:none;box-shadow:var(--sh)}
.qr-link[hidden]{display:none}

footer{margin-top:36px;font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="av">

  <svg class="vf" viewBox="0 0 24 24" aria-label="Đã xác minh">
     <path fill="#1d9bf0" stroke="var(--bg1)" stroke-width="1.5"
    d="M12 1.8l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.2l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.1z"/>
  <path fill="none" stroke="#fff" stroke-width="2.2"
    stroke-linecap="round" stroke-linejoin="round"

</div>
   <h1>Làm chung sức ib zalo</h1>
  <p class="s">Liên hệ & theo dõi mình tại đây 👇</p>
  <div class="list">
    <a class="l" href="https://zalo.me/g/2xjxoy8mgfkfj6fspkwg"><span class="ic z"><b class="zt">Zalo</b></span><span class="t">Box zalo chung sức</span></a>
    <a class="l" href="https://zalo.me/0366822535"><span class="ic z"><b class="zt">Zalo</b></span><span class="t">Zalo 0366.8225.35</span></a>
    <a class="l" href="https://www.youtube.com/@healer2606"><span class="ic y"><svg viewBox="0 0 24 24"><path d="M21.600 7.200a2.500 2.500 0 0 0-1.800-1.800C18.200 5 12 5 12 5s-6.200 0-7.800.4A2.500 2.500 0 0 0 2.400 7.200C2 8.800 2 12 2 12s0 3.200.4 4.800a2.500 2.500 0 0 0 1.800 1.800C5.800 19 12 19 12 19s6.200 0 7.800-.4a2.500 2.500 0 0 0 1.800-1.800c.4-1.600.4-4.800.4-4.800s0-3.200-.4-4.800zM10 15V9l5.200 3z"/></svg></span><span class="t">YouTube</span></a>
    <a class="l" href="https://www.tiktok.com/@healer._01"><span class="ic k"><svg viewBox="0 0 24 24"><path d="M16.600 3c.3 2.300 1.600 3.700 3.900 3.900v3c-1.400.1-2.600-.3-3.900-1.100v5.500c0 7-7.600 9-10.600 4.100-1.900-3.100-.7-8.500 5.200-8.700v3.200c-.5.100-.9.200-1.300.4-1.200.4-1.900 1.100-1.600 2.400.3 2.600 5.100 3.400 4.700-1.700V3z"/></svg></span><span class="t">Tiktok</span></a>
    <a class="l" href="https://discord.com/invite/wrnsSvRER9"><span class="ic d"><svg viewBox="0 0 24 24"><path d="M19.300 5.300A17 17 0 0 0 15.100 4l-.5 1a15 15 0 0 0-5.200 0l-.5-1a17 17 0 0 0-4.200 1.300C2 9.300 1.300 13.200 1.600 17a17 17 0 0 0 5.200 2.600l1.100-1.800-1.700-.8.400-.3a12 12 0 0 0 10.200 0l.4.300-1.700.8 1.100 1.800A17 17 0 0 0 22.400 17c.4-4.400-.7-8.300-3.100-11.700zM9 14.700c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2zm6 0c-1 0-1.800-.9-1.800-2s.8-2 1.800-2 1.800.9 1.800 2-.8 2-1.800 2z"/></svg></span><span class="t">Discord</span></a>

  <span class="ic g"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></span>

<button id="mb" aria-label="Bật/tắt nhạc">🔇</button>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>

<div id="qr" class="qr" hidden>
  <div class="qr-box" role="dialog" aria-modal="true" aria-label="Mã QR donate">
    <button class="qr-x" id="qrx" aria-label="Đóng">✕</button>
    <h3>Ủng hộ mình ❤️</h3>
    <div class="qr-tabs" id="qrt"></div>
    <img id="qri" alt="Mã QR">
    <p id="qrn"></p>
   
<a id="qrl" class="qr-link" href="#" target="_blank" rel="noopener" hidden>Mở link thanh toán →</a>
  </div>
</div>

<script>
(function () {
  var a = document.getElementById('bgm'),
      btn = document.getElementById('mb'),
      evs = ['pointerup', 'touchend', 'click', 'keydown'];
  a.volume = 0.5; // âm lượng 0 → 1

  function ui() {
    var p = !a.paused;
    btn.textContent = p ? '🔊' : '🔇';
    btn.className = p ? 'on' : '';
  }
  function play() { a.play().then(ui).catch(function () {}); }

  btn.addEventListener('click', function () {
    a.paused ? play() : a.pause();
  });
  a.addEventListener('play', ui);
  a.addEventListener('pause', ui);

  // Nếu trình duyệt chặn tự phát, nhạc sẽ chạy ở lần chạm/bấm đầu tiên
  function first(e) {
    if (e.target.closest && e.target.closest('#mb')) return;
    play();
    evs.forEach(function (t) { document.removeEventListener(t, first, true); });
  }
  evs.forEach(function (t) { document.addEventListener(t, first, true); });

  play(); // thử tự phát ngay khi mở trang
})();


(function () {
  // ===== SỬA Ở ĐÂY: thêm/bớt mã QR của bạn =====
  var QR = [
    { name: 'Ngân hàng',       img: 'stk.jpg',   },
    { name: 'Zypage',  img: 'zypage.jpg', },
    { name: 'WeScan',    note: 'Donate qua WeScan', link: 'https://wescan.vn/phanquochung19q', linkText: 'Mở link WeScan →' }
   
  ];
  // ==============================================
var lnk = document.getElementById('qrl');

function show(i) {
  var q = QR[i];

  if (q.img) { img.src = q.img; img.style.display = ''; }
  else { img.removeAttribute('src'); img.style.display = 'none'; }

  note.textContent = q.note || '';

  if (q.link) {
    lnk.href = q.link;
    lnk.textContent = q.linkText || 'Mở link thanh toán →';
    lnk.hidden = false;
  } else {
    lnk.hidden = true;
  }

  [].forEach.call(tabs.children, function (b, k) {
    b.className = k === i ? 'act' : '';
  });
}

  var m = document.getElementById('qr'),
      tabs = document.getElementById('qrt'),
      img = document.getElementById('qri'),
      note = document.getElementById('qrn');

  
  QR.forEach(function (q, i) {
    var b = document.createElement('button');
    b.textContent = q.name;
    b.onclick = function () { show(i); };
    tabs.appendChild(b);
  });
  if (QR.length < 2) tabs.style.display = 'none';

  function open(e) { e.preventDefault(); show(0); m.hidden = false; document.body.style.overflow = 'hidden'; }
  function close() { m.hidden = true; document.body.style.overflow = ''; }

  document.getElementById('donate').addEventListener('click', open);
  document.getElementById('qrx').addEventListener('click', close);
  m.addEventListener('click', function (e) { if (e.target === m) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
})();

</script>
